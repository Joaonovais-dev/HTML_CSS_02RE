<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>imagem dinamica</title>
    <style>
        picture {
            display: block;
            margin: 0 auto;
            max-width: 100%;
            height: auto;
            justify-content: center;
        }
        h1 {
            text-align: center;
            color: #1E3A8A;
        }
        p {
            text-align: center;
            color: #111827;
        }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #F9FAFB;
            color: #111827;
        }

        header {
            background-color: #30c512;
            color: #FFFFFF;
            padding: 20px;
            text-align: center;
        }

        nav {
            background-color: #333;
            overflow: hidden;
            text-align: center;
        }

        nav ul {
            list-style: none;
            margin: 0;
            padding: 10px;
            text-align: center;
        }

        nav ul li {
            display: inline-block;
            margin: 0 15px;
            text-align: center;
        }

        nav ul li a {
            text-decoration: none;
            color: #FFFFFF;
            font-weight: bold;
            text-align: center;
        }

        nav ul li a:hover {
            text-decoration: underline;
        }

        ul {
            list-style-type: none;
            margin: 40px;
            padding: 40px;
            display: flex;
            justify-content: center;


        }

        footer {
            background-color: #E5E7EB;
            text-align: center;
            padding: 15px;
            position: fixed;
            bottom: 0;
            width: 100%;
        }

        main {
            padding: 20px;
            text-align: center;
        }
    </style>
</head>

<body>
    <header>
        <h1>SixBioenergia</h1>
    </header>

    <nav>
        <ul>
            <li><a href="#">Início</a></li>
            <li><a href="#">Sobre</a></li>
            <li><a href="#">Contato</a></li>
        </ul>
    </nav>
    <h1>imagem flexivel</h1>
    <p>tente abrir este site em outros dispositivos</p>
    <main>
        <h2>Sobre Nós</h2>
        <p>Bem-vindo à SixBioenergia! Somos uma empresa dedicada a fornecer soluções de energia sustentável.</p>
    </main>
    <picture style="display: flex; justify-self: unset;">
        <source media="(max-width:750px )" srcset="imagens/70580758-8793-483b-aeea-f2baea8507c2.png" type="image/png">
        <source media="(max-width:1050px )" srcset="imagens/70580758-8793-483b-aeea-f2baea8507c2.png" type="image/png">
        <img src="imagens/70580758-8793-483b-aeea-f2baea8507c2.png" alt="flexivel" >
    </picture>
    <h2>Música</h2>

    <p>ouça nossa música favorita</p>
    <audio src="midia/Skillet_Monster.mp3" controls></audio>
    <br><footer>copyright &copy; 2026 SixBioenergia</footer>
</body>

</html>
